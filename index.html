<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F766E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ميدكونكت | MedConnect Saudi</title>
    <meta name="description" content="استشر أطباء مرخصين عبر المحادثة أو مكالمة الفيديو." />
    <script>
      // Apply stored theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('mc.theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>يتطلب هذا الموقع تفعيل JavaScript. This site requires JavaScript.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
